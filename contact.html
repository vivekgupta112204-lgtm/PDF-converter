<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - PDF Converter</title>
    <meta name="description" content="Get in touch with the PDF Converter team. We are here to help with any questions or feedback.">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans antialiased flex flex-col min-h-screen">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 group">
                <div class="bg-indigo-600 p-1.5 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                </div>
                <span class="text-xl font-bold text-slate-900">PDF Converter</span>
            </a>
            <div class="hidden md:flex gap-8 text-sm font-medium text-slate-600">
                <a href="index.html" class="hover:text-indigo-600 transition-colors">Home</a>
                <a href="about.html" class="hover:text-indigo-600 transition-colors">About Us</a>
                <a href="blog.html" class="hover:text-indigo-600 transition-colors">Blog</a>
                <a href="contact.html" class="text-indigo-600">Contact</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow py-16 px-4">
        <div class="max-w-xl mx-auto">
            <div class="text-center mb-10">
                <h1 class="text-4xl font-extrabold text-slate-900 mb-4">Contact Us</h1>
                <p class="text-lg text-slate-600">Have questions? We'd love to hear from you.</p>
            </div>

            <div class="bg-white rounded-2xl shadow-lg border border-slate-200 p-8">
                <form class="space-y-6" onsubmit="event.preventDefault(); alert('Thank you for your message! We will get back to you shortly.');">
                    <div>
                        <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Full Name</label>
                        <input type="text" id="name" name="name" required class="w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 py-3 px-4 border" placeholder="John Doe">
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Email Address</label>
                        <input type="email" id="email" name="email" required class="w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 py-3 px-4 border" placeholder="john@example.com">
                    </div>

                    <div>
                        <label for="message" class="block text-sm font-medium text-slate-700 mb-1">Message</label>
                        <textarea id="message" name="message" rows="4" required class="w-full rounded-lg border-slate-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 py-3 px-4 border" placeholder="How can we help you?"></textarea>
                    </div>

                    <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                        Send Message
                    </button>
                </form>

                <div class="mt-8 pt-8 border-t border-slate-100 text-center">
                    <p class="text-sm text-slate-500 mb-2">Or email us directly at:</p>
                    <a href="mailto:info@pdfconverter.example.com" class="text-indigo-600 font-medium hover:underline">info@pdfconverter.example.com</a>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-slate-900 text-slate-400 py-12">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <div class="flex justify-center space-x-6 mb-8 text-sm font-medium">
                <a href="index.html" class="hover:text-white transition-colors">Home</a>
                <a href="about.html" class="hover:text-white transition-colors">About Us</a>
                <a href="contact.html" class="text-white transition-colors">Contact</a>
                <a href="privacy.html" class="hover:text-white transition-colors">Privacy</a>
            </div>
            <p class="text-sm">&copy; <script>document.write(new Date().getFullYear())</script> PDF Converter. All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
